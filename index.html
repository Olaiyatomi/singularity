<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Singularity</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#cfd6ff;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
  #hud{position:fixed;left:20px;top:18px;pointer-events:none;transition:opacity 2s;user-select:none}
  #hud h1{margin:0 0 10px;font-weight:300;font-size:13px;letter-spacing:.7em}
  #hud p{margin:0;font-size:11px;line-height:1.8;opacity:.6}
  #bar{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 16px}
  #bar button{background:rgba(0,0,0,.35);color:#cfd6ff;border:1px solid rgba(180,190,255,.18);
    font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:8px 14px;border-radius:999px;cursor:pointer;
    backdrop-filter:blur(6px);transition:all .25s}
  #bar button:hover{border-color:rgba(180,190,255,.5)}
  #bar button.on{background:rgba(200,210,255,.14);border-color:rgba(200,210,255,.6);color:#fff}
  #mass{position:fixed;pointer-events:none;font-size:11px;letter-spacing:.15em;color:#fff;opacity:0;
    transform:translate(18px,-26px);transition:opacity .2s;text-shadow:0 0 8px #000}
  #typed{position:fixed;left:0;right:0;top:50%;text-align:center;font-size:12px;letter-spacing:.5em;
    pointer-events:none;opacity:.0;transition:opacity .3s;transform:translateY(-50%)}
  #fail{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>SINGULARITY</h1>
  <p>move to stir the field<br>hold to open a black hole · release to detonate<br>type any word · ← → palette · ↑ ↓ scene</p>
</div>
<div id="mass"></div>
<div id="typed"></div>
<div id="bar">
  <button data-mode="0">Flow</button>
  <button data-mode="1">Galaxy</button>
  <button data-mode="2">Knot</button>
  <button data-mode="3">Words</button>
  <button id="pal">Nebula</button>
</div>
<div id="fail">WebGL isn't available in this browser.</div>

<script>
(() => {
const TAU = Math.PI * 2;
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {preserveDrawingBuffer: true, antialias: false, alpha: false, depth: false});
if (!gl) { document.getElementById('fail').style.display = 'grid'; return; }

const mobile = matchMedia('(pointer: coarse)').matches || innerWidth < 700;
const N = mobile ? 45000 : 120000;

// ---------- GL setup ----------
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p); return p;
}
const pProg = program(
  `attribute vec2 p;attribute vec3 c;uniform vec2 res;uniform float ps;varying vec3 vc;
   void main(){vec2 q=p/res*2.0-1.0;gl_Position=vec4(q.x,-q.y,0.0,1.0);gl_PointSize=ps;vc=c;}`,
  `precision mediump float;varying vec3 vc;
   void main(){vec2 d=gl_PointCoord-0.5;float a=max(0.0,1.0-dot(d,d)*4.0);gl_FragColor=vec4(vc*a,1.0);}`);
const qProg = program(
  `attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}`,
  `precision mediump float;uniform vec4 col;void main(){gl_FragColor=col;}`);

const data = new Float32Array(N * 5);
const pBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, pBuf); gl.bufferData(gl.ARRAY_BUFFER, data.byteLength, gl.DYNAMIC_DRAW);
const qBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const pL = {p: gl.getAttribLocation(pProg, 'p'), c: gl.getAttribLocation(pProg, 'c'),
            res: gl.getUniformLocation(pProg, 'res'), ps: gl.getUniformLocation(pProg, 'ps')};
const qL = {p: gl.getAttribLocation(qProg, 'p'), col: gl.getUniformLocation(qProg, 'col')};
gl.enable(gl.BLEND);

function quad(r, g, b, a) {
  gl.useProgram(qProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, qBuf);
  gl.enableVertexAttribArray(qL.p);
  gl.vertexAttribPointer(qL.p, 2, gl.FLOAT, false, 0, 0);
  gl.uniform4f(qL.col, r, g, b, a);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.disableVertexAttribArray(qL.p);
}

// ---------- sizing ----------
let W, H, DPR;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR | 0; cv.height = H * DPR | 0;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (word) buildText(word);
}

// ---------- palettes ----------
const PALETTES = [
  ['Nebula', [[30,10,90],[110,40,220],[240,70,160],[255,170,90],[255,250,230]]],
  ['Ice',    [[10,30,110],[20,110,230],[80,210,255],[230,255,255]]],
  ['Ember',  [[90,10,5],[210,50,10],[255,140,30],[255,235,170]]],
  ['Aurora', [[10,50,90],[10,180,150],[120,255,130],[240,255,210]]],
  ['Prism',  null],
];
const lut = new Float32Array(256 * 3);
let palIdx = 0;
function setPalette(i) {
  palIdx = (i + PALETTES.length) % PALETTES.length;
  const [name, stops] = PALETTES[palIdx];
  for (let k = 0; k < 256; k++) {
    let r, g, b;
    if (!stops) {
      const h = k / 256 * 300, s = 1, l = 0.35 + k / 256 * 0.4;
      const f = n => { const kk = (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
        return 255 * (l - a * Math.max(-1, Math.min(kk - 3, 9 - kk, 1))); };
      r = f(0); g = f(8); b = f(4);
    } else {
      const pos = k / 255 * (stops.length - 1), j = Math.min(stops.length - 2, pos | 0), u = pos - j;
      const A = stops[j], B = stops[j + 1];
      r = A[0] + (B[0] - A[0]) * u; g = A[1] + (B[1] - A[1]) * u; b = A[2] + (B[2] - A[2]) * u;
    }
    const s = 0.3 / 255;
    lut[k*3] = r * s; lut[k*3+1] = g * s; lut[k*3+2] = b * s;
  }
  palBtn.textContent = name;
}

// ---------- particles ----------
const x = new Float32Array(N), y = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
const seed = new Float32Array(N), eaten = new Uint8Array(N);
const gR = new Float32Array(N), gL = new Float32Array(N);               // galaxy
const kcp = new Float32Array(N), ksp = new Float32Array(N), kcq = new Float32Array(N), ksq = new Float32Array(N);
const ko1 = new Float32Array(N), ko2 = new Float32Array(N), ko3 = new Float32Array(N); // knot
const tx = new Float32Array(N), ty = new Float32Array(N);               // words
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(TAU * Math.random());

const ARMS = 3;
for (let i = 0; i < N; i++) {
  seed[i] = Math.random();
  let r, a;
  if (Math.random() < 0.2) { r = Math.abs(gauss()) * 0.1; a = Math.random() * TAU; }
  else {
    r = 0.06 + Math.pow(Math.random(), 1.3) * 0.94;
    a = (Math.random() * ARMS | 0) * TAU / ARMS + gauss() * 0.3 * (1.15 - r * 0.6);
  }
  gR[i] = r; gL[i] = a + 2.4 * Math.log(1 + r * 7);
  const u = Math.random() * TAU;
  kcp[i] = Math.cos(2 * u); ksp[i] = Math.sin(2 * u); kcq[i] = Math.cos(3 * u); ksq[i] = Math.sin(3 * u);
  ko1[i] = gauss() * 0.14; ko2[i] = gauss() * 0.14; ko3[i] = gauss() * 0.14;
}

function bigBang() {
  for (let i = 0; i < N; i++) {
    const a = Math.random() * TAU, sp = 2 + Math.pow(Math.random(), 2) * 30;
    x[i] = W / 2; y[i] = H / 2; vx[i] = Math.cos(a) * sp; vy[i] = Math.sin(a) * sp; eaten[i] = 0;
  }
  flash = 1;
}

// ---------- words ----------
let word = '';
function buildText(str) {
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const c = oc.getContext('2d');
  let fs = Math.min(H * 0.38, 280);
  const font = s => `900 ${s}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  c.font = font(fs);
  const w = c.measureText(str).width;
  if (w > W * 0.88) { fs *= W * 0.88 / w; c.font = font(fs); }
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
  c.fillText(str, W / 2, H / 2);
  const d = c.getImageData(0, 0, W, H).data, pts = [], step = 2;
  for (let yy = 0; yy < H; yy += step)
    for (let xx = 0; xx < W; xx += step)
      if (d[(yy * W + xx) * 4 + 3] > 128) pts.push(xx, yy);
  if (!pts.length) return false;
  const n = pts.length / 2;
  for (let i = 0; i < N; i++) {
    const j = (Math.random() * n | 0) * 2;
    tx[i] = pts[j] + Math.random() * step; ty[i] = pts[j + 1] + Math.random() * step;
  }
  return true;
}

// ---------- interaction ----------
let mode = 0, down = false, hover = false, mx = -1e4, my = -1e4, holdStart = 0, mass = 0, flash = 0;
const massEl = document.getElementById('mass'), typedEl = document.getElementById('typed');
const hud = document.getElementById('hud'), palBtn = document.getElementById('pal');
const modeBtns = [...document.querySelectorAll('[data-mode]')];

function setMode(m) {
  if (m === 3 && !word) { askWord(); return; }
  mode = m;
  modeBtns.forEach(b => b.classList.toggle('on', +b.dataset.mode === m));
}
function askWord() {
  const w = (prompt('Say something:', word || 'hello') || '').trim().slice(0, 16);
  if (w && buildText(w)) { word = w; setMode(3); }
}

cv.addEventListener('pointerdown', e => {
  down = true; holdStart = performance.now(); mass = 0; mx = e.clientX; my = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; hover = true; });
cv.addEventListener('pointerleave', () => { if (!down) hover = false; });
const release = () => { if (down) { down = false; detonate(); } };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

function detonate() {
  const held = (performance.now() - holdStart) / 1000;
  const power = 1 + Math.min(held, 4) * 0.8;
  const hr = horizon();
  for (let i = 0; i < N; i++) {
    if (eaten[i]) {
      eaten[i] = 0;
      const a = Math.random() * TAU, sp = (1 + Math.pow(Math.random(), 2) * 22) * power * 0.6;
      x[i] = mx + Math.cos(a) * hr; y[i] = my + Math.sin(a) * hr;
      vx[i] = Math.cos(a) * sp; vy[i] = Math.sin(a) * sp;
    } else {
      const dx = x[i] - mx, dy = y[i] - my, d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      if (d < 420) { const f = (1 - d / 420) * 12 * power; vx[i] += dx / d * f; vy[i] += dy / d * f; }
    }
  }
  flash = Math.min(1, mass / N * 3 + 0.15);
  mass = 0;
}
const horizon = () => Math.min(36, 4 + Math.sqrt(mass) * 0.12);

let typed = '', typeTimer = 0, committed = false;
function showTyped() {
  typedEl.textContent = typed ? typed + '_' : '';
  typedEl.style.opacity = typed ? 0.8 : 0;
}
function commitTyped() {
  clearTimeout(typeTimer);
  const w = typed.trim();
  committed = true; typedEl.style.opacity = 0;
  if (w && buildText(w)) { word = w; setMode(3); }
}
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight') { setPalette(palIdx + (k === 'ArrowRight' ? 1 : -1)); e.preventDefault(); return; }
  if (k === 'ArrowUp' || k === 'ArrowDown') {
    const count = word ? 4 : 3;
    setMode((mode + (k === 'ArrowDown' ? 1 : -1) + count) % count); e.preventDefault(); return;
  }
  if (k === 'Escape') { typed = ''; showTyped(); setMode(0); return; }
  if (k === 'Enter') { e.preventDefault(); commitTyped(); return; }
  if (k === 'Backspace') { typed = typed.slice(0, -1); }
  else if (k.length === 1) { if (committed) { typed = ''; committed = false; } typed = (typed + k).slice(0, 16); }
  else return;
  e.preventDefault(); showTyped();
  clearTimeout(typeTimer); typeTimer = setTimeout(commitTyped, 900);
});

modeBtns.forEach(b => b.addEventListener('click', () => {
  const m = +b.dataset.mode; b.blur();
  if (m === 3) askWord(); else setMode(m);
}));
palBtn.addEventListener('click', () => { setPalette(palIdx + 1); palBtn.blur(); });
setTimeout(() => hud.style.opacity = 0.35, 7000);

// ---------- main loop ----------
const FADE = [0.07, 0.1, 0.16, 0.14];
function frame(now) {
  const t = now * 0.001;
  const m = mode, cx = W / 2, cy = H / 2;
  const damp = m === 0 ? 0.965 : 0.9, flowF = m === 0 ? 0.09 : 0.012, k = m === 3 ? 0.028 : 0.018;
  const GR = Math.min(W, H) * 0.47, gRot = t * 0.12;
  const cA = Math.cos(t * 0.35), sA = Math.sin(t * 0.35), cB = Math.cos(t * 0.23 + 0.6), sB = Math.sin(t * 0.23 + 0.6);
  const KS = Math.min(W, H) * 0.115;
  const held = down ? (now - holdStart) / 1000 : 0;
  const pull = 70 * (1 + Math.min(held, 3) * 0.6);
  const hr = horizon(), hr2 = hr * hr;
  const mX = mx, mY = my, isDown = down, isHover = hover && !down;

  for (let i = 0; i < N; i++) {
    const o = i * 5;
    if (eaten[i]) { data[o] = mX; data[o+1] = mY; data[o+2] = data[o+3] = data[o+4] = 0; continue; }
    let X = x[i], Y = y[i], VX = vx[i], VY = vy[i], bri = 1, idxBoost = 0;

    // ambient flow field
    const a = (Math.sin(X * 0.0021 + t * 0.13) + Math.cos(Y * 0.0027 - t * 0.11) + Math.sin((X - Y) * 0.0013 + t * 0.07)) * 2.2;
    VX += Math.cos(a) * flowF; VY += Math.sin(a) * flowF;

    // scene targets
    if (m === 1) {
      const r = gR[i] * GR, th = gL[i] + gRot;
      VX += (cx + Math.cos(th) * r - X) * k;
      VY += (cy + Math.sin(th) * r * 0.62 - Y) * k;
      idxBoost = (1 - gR[i]) * 110;
    } else if (m === 2) {
      const r = kcq[i] + 2.2;
      const X0 = r * kcp[i] + ko1[i], Y0 = r * ksp[i] + ko2[i], Z0 = -ksq[i] + ko3[i];
      const x1 = X0 * cA + Z0 * sA, z1 = -X0 * sA + Z0 * cA;
      const y1 = Y0 * cB - z1 * sB, z2 = Y0 * sB + z1 * cB;
      const pz = 7 / (7 + z2);
      VX += (cx + x1 * KS * pz - X) * k;
      VY += (cy + y1 * KS * pz - Y) * k;
      bri = pz * pz * 0.55; idxBoost = (pz - 0.7) * 120;
    } else if (m === 3) {
      VX += (tx[i] - X) * k; VY += (ty[i] - Y) * k;
    }

    // pointer: black hole while held, gentle wake while hovering
    if (isDown) {
      const dx = mX - X, dy = mY - Y, d2 = dx * dx + dy * dy;
      if (d2 < hr2) { eaten[i] = 1; mass++; data[o+2] = data[o+3] = data[o+4] = 0; continue; }
      const d = Math.sqrt(d2), f = pull / (d + 40);
      const nx = dx / d, ny = dy / d;
      VX += nx * f - ny * f * 0.9; VY += ny * f + nx * f * 0.9;
    } else if (isHover) {
      const dx = X - mX, dy = Y - mY, d2 = dx * dx + dy * dy;
      if (d2 < 22500) {
        const d = Math.sqrt(d2) + 0.01, f = (1 - d / 150) * 0.9;
        VX += (dx / d - dy / d * 0.6) * f; VY += (dy / d + dx / d * 0.6) * f;
      }
    }

    VX *= damp; VY *= damp; X += VX; Y += VY;
    if (m === 0) {
      if (X < 0) X += W; else if (X > W) X -= W;
      if (Y < 0) Y += H; else if (Y > H) Y -= H;
    }
    x[i] = X; y[i] = Y; vx[i] = VX; vy[i] = VY;

    let idx = Math.sqrt(VX * VX + VY * VY) * 22 + seed[i] * 70 + idxBoost;
    idx = (idx > 255 ? 255 : idx < 0 ? 0 : idx) | 0;
    const c = idx * 3;
    data[o] = X; data[o+1] = Y;
    data[o+2] = lut[c] * bri; data[o+3] = lut[c+1] * bri; data[o+4] = lut[c+2] * bri;
  }

  // fade previous frame (multiply, then subtract to kill 8-bit ghosting)
  gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  quad(0, 0, 0, FADE[m]);
  gl.blendEquation(gl.FUNC_REVERSE_SUBTRACT); gl.blendFunc(gl.ONE, gl.ONE);
  quad(1.5 / 255, 1.5 / 255, 1.5 / 255, 0);

  // particles, additive
  gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(pProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, pBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);
  gl.enableVertexAttribArray(pL.p); gl.enableVertexAttribArray(pL.c);
  gl.vertexAttribPointer(pL.p, 2, gl.FLOAT, false, 20, 0);
  gl.vertexAttribPointer(pL.c, 3, gl.FLOAT, false, 20, 8);
  gl.uniform2f(pL.res, W, H);
  gl.uniform1f(pL.ps, (mobile ? 1.8 : 1.5) * DPR);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.disableVertexAttribArray(pL.p); gl.disableVertexAttribArray(pL.c);

  if (flash > 0.01) { quad(flash * 0.35, flash * 0.33, flash * 0.4, 0); flash *= 0.86; }

  if (down) {
    massEl.style.opacity = 1;
    massEl.style.left = mX + 'px'; massEl.style.top = mY + 'px';
    massEl.textContent = mass ? mass.toLocaleString() + ' swallowed' : '';
  } else massEl.style.opacity = 0;

  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
setPalette(0);
setMode(0);
bigBang();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
